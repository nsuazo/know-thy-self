<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Know Thy Self{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Know Thy Self</a>
    <nav>
      <a href="/" class="{{ 'active' if nav == 'journal' }}">Journal</a>
      <a href="/history" class="{{ 'active' if nav == 'history' }}">History</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
